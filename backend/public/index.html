<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="Copaz — la app para padres separados que organiza todo lo de sus hijos en paz: calendario de custodia, gastos, mensajes, pensión de alimentos y perfiles." />
  <title>Copaz — Coparentalidad en paz</title>
  <!-- Redes sociales. CAMBIA la URL base por tu dominio final cuando lo tengas. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Copaz" />
  <meta property="og:title" content="Copaz — Coparentalidad en paz" />
  <meta property="og:description" content="Todo lo de tus hijos, coordinado con el otro padre en un solo lugar: custodia, gastos, mensajes, pensión y más." />
  <meta property="og:image" content="https://accomplished-prosperity-production-5a5c.up.railway.app/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Copaz" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <!-- Rendered by app.js -->
  </div>

  <!-- Sidebar / bottom navigation -->
  <nav id="nav" class="nav" aria-label="Navegación principal"></nav>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <!-- Toast host -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="api-client.js"></script>
  <script src="app.js" defer></script>
  <script>
    /* Actualización automática: cuando se publica una versión nueva, la app
       la instala en segundo plano y se recarga sola una sola vez. El usuario
       siempre tiene la última versión sin limpiar caché ni reinstalar. */
    if ('serviceWorker' in navigator) {
      const habiaControlador = !!navigator.serviceWorker.controller;
      let recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (recargando || !habiaControlador) return; // no recargar en la primera instalación
        recargando = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          // Cuando hay una versión nueva esperando, actívala de inmediato.
          const activarSiHay = () => { if (reg.waiting) reg.waiting.postMessage('skipWaiting'); };
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed') activarSiHay(); });
          });
          activarSiHay();
          // Buscar actualizaciones al volver a la app y de forma periódica.
          const buscar = () => reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscar(); });
          setInterval(buscar, 30 * 60 * 1000);
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
