<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="Copaz — la app para padres separados que organiza todo lo de sus hijos en paz: calendario de custodia, gastos, mensajes y perfiles." />
  <title>Copaz — Coparentalidad en paz</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Copaz" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <!-- Rendered by app.js -->
  </div>

  <!-- Sidebar / bottom navigation -->
  <nav id="nav" class="nav" aria-label="Navegación principal"></nav>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <!-- Toast host -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="api-client.js"></script>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
